<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F8FAFC] text-slate-900 antialiased selection:bg-slate-900 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHEL // Focus Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvasBg: '#F8FAFC',
                        surfaceWhite: '#FFFFFF',
                        borderSubtle: 'rgba(15, 23, 42, 0.08)',
                        charcoal: '#0F172A',
                        slateMuted: '#64748B',
                        emeraldAccent: '#059669',
                        emeraldGlow: 'rgba(5, 150, 105, 0.15)',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'SFMono-Regular', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .apple-shadow { box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05), 0 0 1px 1px rgba(15, 23, 42, 0.05); }
        .ring-glow { filter: drop-shadow(0 10px 25px rgba(5, 150, 105, 0.2)); }
        .subtle-grid {
            background-image: radial-gradient(rgba(15, 23, 42, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="h-screen w-screen bg-canvasBg subtle-grid text-charcoal font-sans flex flex-col justify-between overflow-hidden relative p-6 md:p-10">

    <!-- TOP HEADER (Minimalist Brand & Meta) -->
    <header class="w-full max-w-6xl mx-auto flex items-center justify-between z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-charcoal text-white flex items-center justify-center font-bold text-xs shadow-md">
                Æ
            </div>
            <span class="font-bold tracking-tight text-charcoal text-sm">AETHEL</span>
            <span class="text-[10px] font-mono bg-slate-200/60 text-slate-600 px-2 py-0.5 rounded-full font-semibold">STUDIO</span>
        </div>

        <div class="flex items-center gap-4 text-xs font-mono">
            <div class="bg-surfaceWhite border border-borderSubtle px-4 py-2 rounded-xl apple-shadow flex items-center gap-2">
                <span class="text-slateMuted">YIELD</span>
                <span id="userPoints" class="text-charcoal font-bold">1,250 XP</span>
            </div>
            <div class="bg-surfaceWhite border border-borderSubtle px-4 py-2 rounded-xl apple-shadow flex items-center gap-2">
                <span class="text-slateMuted">STREAK</span>
                <span class="text-emeraldAccent font-bold">12 DAYS</span>
            </div>
        </div>
    </header>

    <!-- CENTERPIECE: ARCHITECTURAL CLOCK CANVAS -->
    <main class="my-auto flex flex-col items-center justify-center relative z-10">
        
        <!-- MAIN CIRCULAR ENGINE -->
        <div class="relative flex items-center justify-center cursor-pointer group" onclick="toggleSession()">
            
            <!-- SVG RING (Precision Mathematical Centering) -->
            <svg class="w-[340px] h-[340px] md:w-[420px] md:h-[420px] transform -rotate-90 overflow-visible transition-all duration-700" id="svgGauge">
                <circle cx="50%" cy="50%" r="42%" stroke="#E2E8F0" stroke-width="6" fill="transparent" />
                <circle id="timerProgress" cx="50%" cy="50%" r="42%" stroke="#059669" stroke-width="8" fill="transparent" stroke-dasharray="1100" stroke-dashoffset="0" stroke-linecap="round" class="ring-glow transition-all duration-1000 ease-linear" />
            </svg>

            <!-- PERFECTLY CENTERED READOUT -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center select-none pointer-events-none">
                <div id="targetDisplay" class="text-[11px] font-mono tracking-wider text-slateMuted bg-slate-100 border border-slate-200/80 px-3.5 py-1 rounded-full uppercase mb-3 max-w-[220px] truncate shadow-sm">
                    INTENTION IDLE
                </div>
                <div id="timeReadout" class="text-6xl md:text-7xl font-mono font-bold tracking-tight text-charcoal">
                    25:00
                </div>
                <div id="statusBadge" class="mt-3 text-[11px] font-mono tracking-widest text-emeraldAccent uppercase flex items-center gap-2 font-semibold">
                    <span id="statusPulse" class="w-2 h-2 rounded-full bg-emeraldAccent"></span>
                    <span id="statusText">READY TO ENGAGE</span>
                </div>
            </div>

        </div>

    </main>

    <!-- FLOATING ARCHITECTURAL CONTROL DOCK -->
    <footer class="w-full max-w-4xl mx-auto z-20 flex flex-col md:flex-row items-center justify-between gap-4">
        
        <!-- OBJECTIVE INPUT FIELD -->
        <div class="bg-surfaceWhite border border-borderSubtle rounded-2xl p-2.5 w-full md:w-80 apple-shadow flex items-center gap-2">
            <span class="pl-2 text-slate-400 text-xs">🎯</span>
            <input id="primaryTarget" type="text" placeholder="State non-negotiable target..." class="w-full bg-transparent text-xs text-charcoal placeholder-slate-400 focus:outline-none font-medium">
        </div>

        <!-- DURATION & ACTION DOCK -->
        <div class="bg-surfaceWhite border border-borderSubtle rounded-2xl p-2 apple-shadow flex items-center gap-3">
            <div class="flex gap-1 font-mono text-xs">
                <button onclick="setMins(5)" class="dur-btn px-3 py-2 rounded-xl text-slateMuted hover:text-charcoal hover:bg-slate-50 transition">05M</button>
                <button onclick="setMins(15)" class="dur-btn px-3 py-2 rounded-xl text-slateMuted hover:text-charcoal hover:bg-slate-50 transition">15M</button>
                <button onclick="setMins(25)" class="dur-btn px-3 py-2 rounded-xl bg-charcoal text-white font-bold transition shadow-sm">25M</button>
                <button onclick="setMins(45)" class="dur-btn px-3 py-2 rounded-xl text-slateMuted hover:text-charcoal hover:bg-slate-50 transition">45M</button>
            </div>
            <div class="h-5 w-[1px] bg-slate-200"></div>
            <button id="actionBtn" onclick="toggleSession()" class="bg-emeraldAccent hover:bg-emerald-700 text-white font-mono font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-md shadow-emeraldAccent/20">
                INITIATE
            </button>
        </div>

        <!-- AUDITORY MASKING CONTROLS -->
        <div class="bg-surfaceWhite border border-borderSubtle rounded-2xl p-2 apple-shadow flex items-center gap-2 font-mono text-xs">
            <span class="text-[10px] text-slateMuted pl-2">SOUND:</span>
            <button id="sndOff" onclick="setSound('none')" class="snd-btn bg-slate-100 text-charcoal font-bold px-2.5 py-1.5 rounded-lg border border-slate-200">OFF</button>
            <button id="sndBeta" onclick="setSound('binaural')" class="snd-btn text-slateMuted hover:text-charcoal px-2.5 py-1.5 rounded-lg">16Hz BETA</button>
            <button id="sndPink" onclick="setSound('pink')" class="snd-btn text-slateMuted hover:text-charcoal px-2.5 py-1.5 rounded-lg">PINK</button>
        </div>

    </footer>

    <!-- ENGINE LOGIC -->
    <script>
        let duration = 25 * 60;
        let timeRemaining = duration;
        let timer = null;
        let isRunning = false;
        let audioCtx = null;
        let activeNodes = [];
        let soundMode = 'none';

        const timeReadout = document.getElementById('timeReadout');
        const timerProgress = document.getElementById('timerProgress');
        const statusText = document.getElementById('statusText');
        const statusPulse = document.getElementById('statusPulse');
        const actionBtn = document.getElementById('actionBtn');
        const targetDisplay = document.getElementById('targetDisplay');

        function setMins(m) {
            if (isRunning) return;
            duration = m * 60;
            timeRemaining = duration;
            document.querySelectorAll('.dur-btn').forEach(b => b.className = "dur-btn px-3 py-2 rounded-xl text-slateMuted hover:text-charcoal hover:bg-slate-50 transition");
            event.currentTarget.className = "dur-btn px-3 py-2 rounded-xl bg-charcoal text-white font-bold transition shadow-sm";
            updateGauge();
        }

        function setSound(mode) {
            soundMode = mode;
            document.querySelectorAll('.snd-btn').forEach(b => b.className = "snd-btn text-slateMuted hover:text-charcoal px-2.5 py-1.5 rounded-lg");
            event.currentTarget.className = "snd-btn bg-slate-100 text-charcoal font-bold px-2.5 py-1.5 rounded-lg border border-slate-200";
        }

        function updateGauge() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            timeReadout.innerText = `${m}:${s}`;

            const total = 1100;
            const offset = total - (timeRemaining / duration) * total;
            timerProgress.style.strokeDashoffset = offset;
        }

        function toggleSession() {
            if (isRunning) {
                stopSession(false);
            } else {
                startSession();
            }
        }

        function startSession() {
            const target = document.getElementById('primaryTarget').value.trim() || 'DEEP FOCUS SESSION';
            targetDisplay.innerText = target;
            
            isRunning = true;
            actionBtn.innerText = "ABORT";
            actionBtn.className = "bg-rose-500 hover:bg-rose-600 text-white font-mono font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-md shadow-rose-500/20";
            
            statusText.innerText = "SESSION ACTIVE";
            statusPulse.className = "w-2 h-2 rounded-full bg-emeraldAccent animate-ping";

            startAudio();

            timer = setInterval(() => {
                timeRemaining--;
                updateGauge();
                if (timeRemaining <= 0) stopSession(true);
            }, 1000);
        }

        function stopSession(completed) {
            clearInterval(timer);
            timer = null;
            isRunning = false;
            stopAudio();

            actionBtn.innerText = "INITIATE";
            actionBtn.className = "bg-emeraldAccent hover:bg-emerald-700 text-white font-mono font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-md shadow-emeraldAccent/20";
            statusText.innerText = "READY TO ENGAGE";
            statusPulse.className = "w-2 h-2 rounded-full bg-emeraldAccent";

            timeRemaining = duration;
            updateGauge();
        }

        function startAudio() {
            if (soundMode === 'none') return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (soundMode === 'binaural') {
                let m = audioCtx.createChannelMerger(2);
                let o1 = audioCtx.createOscillator(); o1.frequency.value = 400; o1.connect(m, 0, 0);
                let o2 = audioCtx.createOscillator(); o2.frequency.value = 416; o2.connect(m, 0, 1);
                m.connect(audioCtx.destination); o1.start(); o2.start();
                activeNodes = [o1, o2];
            }
        }

        function stopAudio() {
            activeNodes.forEach(n => { try { n.stop(); } catch(e){} });
            if (audioCtx) audioCtx.close();
            activeNodes = [];
        }

        updateGauge();
    </script>
</body>
</html>
