<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AETHEL — Deep Focus Protocol</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090B;
      color: #F4F4F5;
    }
    .font-serif-luxury {
      font-family: 'Cinzel', serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-black p-0 sm:p-4">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [task, setTask] = useState('');
      const [isFocusing, setIsFocusing] = useState(false);
      const [secondsLeft, setSecondsLeft] = useState(15 * 60);
      const [totalSeconds, setTotalSeconds] = useState(15 * 60);
      const [showHonestyGate, setShowHonestyGate] = useState(false);

      const [dopamineScore, setDopamineScore] = useState(() => {
        try { return parseInt(localStorage.getItem('aethel_score') || '0', 10); } 
        catch { return 0; }
      });

      const [history, setHistory] = useState(() => {
        try { return JSON.parse(localStorage.getItem('aethel_history') || '[]'); } 
        catch { return []; }
      });

      useEffect(() => {
        localStorage.setItem('aethel_score', dopamineScore.toString());
      }, [dopamineScore]);

      useEffect(() => {
        localStorage.setItem('aethel_history', JSON.stringify(history));
      }, [history]);

      useEffect(() => {
        let interval = null;
        if (isFocusing && secondsLeft > 0) {
          interval = setInterval(() => {
            setSecondsLeft((prev) => prev - 1);
          }, 1000);
        } else if (secondsLeft === 0 && isFocusing) {
          completeSession(true, 'Full Cycle Completed');
        }
        return () => clearInterval(interval);
      }, [isFocusing, secondsLeft]);

      const startTimer = (mins) => {
        const secs = mins * 60;
        setTotalSeconds(secs);
        setSecondsLeft(secs);
        setIsFocusing(true);
      };

      const completeSession = (isFullSuccess, note) => {
        setIsFocusing(false);
        const earned = isFullSuccess ? 150 : 50;
        setDopamineScore((prev) => prev + earned);

        const newEntry = {
          id: Date.now(),
          task: task.trim() || 'Unspecified Protocol',
          duration: Math.max(1, Math.round((totalSeconds - secondsLeft) / 60)),
          earned,
          note,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setHistory((prev) => [newEntry, ...prev]);
        setShowHonestyGate(false);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const progress = ((totalSeconds - secondsLeft) / totalSeconds) * 100;

      return (
        <div className="w-full max-w-[390px] h-[844px] bg-[#09090B] border border-zinc-800 sm:rounded-[44px] shadow-2xl flex flex-col justify-between p-6 relative overflow-hidden hide-scrollbar">
          
          {/* Header */}
          <div className="flex justify-between items-center pt-2">
            <div>
              <h1 className="font-serif-luxury text-xl tracking-[0.2em] text-zinc-100 font-bold uppercase">AETHEL</h1>
              <p className="text-[10px] tracking-widest text-zinc-500 uppercase font-semibold mt-0.5">Focus Architecture</p>
            </div>
            <div className="bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="text-xs font-semibold text-zinc-300 tracking-wider">{dopamineScore} <span className="text-[9px] text-zinc-500">PTS</span></span>
            </div>
          </div>

          {/* Core Focus Area */}
          <div className="flex flex-col items-center my-auto space-y-6">
            
            {/* Task Input */}
            <div className="w-full">
              <input 
                type="text"
                disabled={isFocusing}
                value={task}
                onChange={(e) => setTask(e.target.value)}
                placeholder="Enter single focus target..."
                className="w-full bg-zinc-900/60 border border-zinc-800 rounded-2xl px-4 py-3 text-xs text-center text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-all disabled:opacity-50"
              />
            </div>

            {/* Circular Timer Visual */}
            <div className="relative w-56 h-56 flex items-center justify-center">
              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" stroke="#18181B" strokeWidth="4" fill="transparent" />
                <circle 
                  cx="50" 
                  cy="50" 
                  r="42" 
                  stroke="#F4F4F5" 
                  strokeWidth="4" 
                  fill="transparent" 
                  strokeDasharray={263.89}
                  strokeDashoffset={263.89 - (263.89 * progress) / 100}
                  className="transition-all duration-500 ease-out"
                  strokeLinecap="round"
                />
              </svg>
              <div className="absolute flex flex-col items-center">
                <span className="text-5xl font-light tracking-tight text-zinc-100 font-mono">
                  {formatTime(secondsLeft)}
                </span>
                <span className="text-[9px] tracking-[0.25em] text-zinc-500 uppercase mt-2 font-medium">
                  {isFocusing ? 'LOCK-IN ACTIVE' : 'SYSTEM IDLE'}
                </span>
              </div>
            </div>

            {/* Control Options */}
            {!isFocusing ? (
              <div className="w-full grid grid-cols-3 gap-2">
                <button onClick={() => startTimer(5)} className="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 text-xs py-3 rounded-2xl font-medium transition-all">5 MIN</button>
                <button onClick={() => startTimer(15)} className="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 text-xs py-3 rounded-2xl font-medium transition-all">15 MIN</button>
                <button onClick={() => startTimer(25)} className="bg-zinc-100 text-black text-xs py-3 rounded-2xl font-bold transition-all hover:bg-white">25 MIN</button>
              </div>
            ) : (
              <button 
                onClick={() => setShowHonestyGate(true)}
                className="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-300 text-xs py-3.5 rounded-2xl tracking-wider font-semibold uppercase transition-all"
              >
                Conclude Protocol
              </button>
            )}

          </div>

          {/* Activity Log */}
          <div className="w-full space-y-2">
            <span className="text-[9px] tracking-widest text-zinc-500 uppercase font-semibold block px-1">Completed Cycles</span>
            <div className="max-h-28 overflow-y-auto space-y-1.5 hide-scrollbar">
              {history.length === 0 ? (
                <div className="bg-zinc-900/30 border border-zinc-900 rounded-xl p-3 text-center">
                  <p className="text-[11px] text-zinc-600">No active records logged yet.</p>
                </div>
              ) : (
                history.map((item) => (
                  <div key={item.id} className="bg-zinc-900/60 border border-zinc-800/80 rounded-xl px-3 py-2 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-zinc-200 font-medium truncate max-w-[180px]">{item.task}</p>
                      <p className="text-[9px] text-zinc-500">{item.note} • {item.duration}m</p>
                    </div>
                    <span className="text-xs font-mono text-zinc-400">+{item.earned}</span>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Honesty System Modal */}
          {showHonestyGate && (
            <div className="absolute inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col justify-end p-6">
              <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 space-y-4">
                <div>
                  <h3 className="text-sm font-semibold text-zinc-100">Honesty Gate</h3>
                  <p className="text-[11px] text-zinc-400 mt-1">Select the condition for ending this session early:</p>
                </div>

                <div className="space-y-2">
                  <button 
                    onClick={() => completeSession(false, 'Pause / Excuse')}
                    className="w-full bg-zinc-800 hover:bg-zinc-750 text-zinc-200 text-left p-3.5 rounded-xl border border-zinc-700/50 flex justify-between items-center"
                  >
                    <div>
                      <p className="text-xs font-medium">Valid Excuse / Break</p>
                      <p className="text-[9px] text-zinc-400">Distraction wave or fatigue</p>
                    </div>
                    <span className="text-xs font-mono text-zinc-400">+50 PTS</span>
                  </button>

                  <button 
                    onClick={() => completeSession(true, 'Target Completed Early')}
                    className="w-full bg-zinc-100 hover:bg-white text-black text-left p-3.5 rounded-xl flex justify-between items-center"
                  >
                    <div>
                      <p className="text-xs font-bold">Finished Target Early</p>
                      <p className="text-[9px] text-zinc-600">Goal accomplished ahead of time</p>
                    </div>
                    <span className="text-xs font-mono font-bold">+150 PTS</span>
                  </button>

                  <button 
                    onClick={() => setShowHonestyGate(false)}
                    className="w-full text-center text-[11px] text-zinc-500 py-2 hover:text-zinc-300"
                  >
                    Resume Focus Session
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
