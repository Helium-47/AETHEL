<!DOCTYPE html>
<html lang="en" class="h-full bg-[#090A0D] text-slate-100 antialiased selection:bg-[#D6FF38] selection:text-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHEL // Revision Hub</title>
    
    <!-- FAVICON (AE ICON IN BROWSER TAB) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%20%2220%22 fill=%22%23D6FF38%22/><text y=%22.9em%22 x=%2220%22 font-size=%2270%22 font-weight=%22bold%22 fill=%22black%22 font-family=%22sans-serif%22>Æ</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090A0D',
                        darkCard: '#12141A',
                        darkCardHover: '#1A1D26',
                        darkBorder: '#222630',
                        limeAccent: '#D6FF38',
                        mutedText: '#717784',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #090A0D;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .lime-glow { filter: drop-shadow(0 0 15px rgba(214, 255, 56, 0.25)); }
        .card-shadow { box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
        
        /* HIDE SPINNER ARROWS ON NUMBER INPUT */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen w-screen text-slate-100 font-sans flex flex-col justify-between p-4 md:p-8 select-none">

    <!-- TOP BAR -->
    <header class="w-full max-w-6xl mx-auto flex items-center justify-between pb-6 border-b border-darkBorder/60">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-limeAccent text-black flex items-center justify-center font-bold text-xs shadow-lg">
                Æ
            </div>
            <div>
                <span class="font-bold tracking-tight text-white text-sm">AETHEL</span>
                <span class="text-mutedText font-mono text-xs ml-1.5">// FOCUS PROTOCOL</span>
            </div>
        </div>

        <div class="flex items-center gap-3 font-mono text-xs">
            <div class="bg-darkCard border border-darkBorder px-3.5 py-1.5 rounded-xl text-slate-300 flex items-center gap-2">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-limeAccent"></span>
                <span id="statusText">Ready</span>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="w-full max-w-6xl mx-auto my-auto py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- LEFT COLUMN: POMODORO CLOCK (7 COLS) -->
        <section class="lg:col-span-7 flex flex-col gap-5">
            
            <div class="bg-darkCard border border-darkBorder rounded-3xl p-6 md:p-8 card-shadow flex flex-col items-center justify-center relative">
                
                <!-- POMODORO MODE SWITCHER -->
                <div class="flex items-center gap-2 bg-darkBg border border-darkBorder p-1 rounded-2xl mb-4 font-mono text-xs">
                    <button id="modePomo" onclick="setMode('pomo')" class="px-4 py-1.5 rounded-xl bg-limeAccent text-black font-bold transition">Pomodoro (25m)</button>
                    <button id="modeShort" onclick="setMode('short')" class="px-4 py-1.5 rounded-xl text-mutedText hover:text-white transition">Short Break (5m)</button>
                    <button id="modeLong" onclick="setMode('long')" class="px-4 py-1.5 rounded-xl text-mutedText hover:text-white transition">Long Break (15m)</button>
                </div>

                <!-- CIRCULAR CLOCK HERO -->
                <div class="relative flex items-center justify-center my-2 cursor-pointer" onclick="toggleSession()">
                    <svg class="w-[250px] h-[250px] md:w-[290px] md:h-[290px] transform -rotate-90 overflow-visible">
                        <circle cx="50%" cy="50%" r="42%" stroke="#1A1D26" stroke-width="8" fill="transparent" />
                        <circle id="timerProgress" cx="50%" cy="50%" r="42%" stroke="#D6FF38" stroke-width="8" fill="transparent" stroke-dasharray="1100" stroke-dashoffset="0" stroke-linecap="round" class="lime-glow transition-all duration-1000 ease-linear" />
                    </svg>

                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
                        <span class="text-[10px] font-mono tracking-widest text-mutedText uppercase mb-1">REMAINING</span>
                        <div id="timeReadout" class="text-5xl md:text-6xl font-mono font-bold tracking-tight text-white">
                            25:00
                        </div>
                        <div id="subjectBadge" class="mt-3 text-xs font-mono text-limeAccent bg-limeAccent/10 border border-limeAccent/20 px-3 py-1 rounded-full font-semibold max-w-[200px] truncate">
                            NO ACTIVE TASK
                        </div>
                    </div>
                </div>

                <!-- DURATION & CUSTOM ADJUSTER -->
                <div class="w-full max-w-md flex flex-col gap-3 mt-4">
                    <div class="grid grid-cols-4 gap-2 font-mono text-xs">
                        <button onclick="setMins(15)" class="dur-btn py-2 rounded-xl border border-darkBorder text-mutedText hover:text-white transition">15m</button>
                        <button onclick="setMins(25)" class="dur-btn py-2 rounded-xl bg-limeAccent text-black font-bold transition">25m</button>
                        <button onclick="setMins(45)" class="dur-btn py-2 rounded-xl border border-darkBorder text-mutedText hover:text-white transition">45m</button>
                        <button onclick="setMins(60)" class="dur-btn py-2 rounded-xl border border-darkBorder text-mutedText hover:text-white transition">60m</button>
                    </div>

                    <div class="flex items-center justify-between bg-darkBg border border-darkBorder rounded-xl px-3 py-2 font-mono text-xs">
                        <span class="text-mutedText">Custom Length (mins):</span>
                        <div class="flex items-center gap-2">
                            <input id="customMinsInput" type="number" min="1" max="180" value="25" class="w-16 bg-darkCard border border-darkBorder text-white text-center rounded-lg py-1 focus:outline-none focus:border-limeAccent font-mono">
                            <button onclick="applyCustomMins()" class="bg-darkCard border border-darkBorder text-slate-200 px-3 py-1 rounded-lg hover:text-white hover:border-slate-500 transition">Set</button>
                        </div>
                    </div>
                </div>

                <!-- SESSION CONTROLS -->
                <div class="flex items-center gap-3 mt-6">
                    <button id="actionBtn" onclick="toggleSession()" class="px-8 py-3 bg-limeAccent hover:bg-[#c2ed2e] text-black font-bold rounded-2xl font-mono text-sm tracking-wide shadow-lg transition transform active:scale-95">
                        START SESSION
                    </button>
                    <button id="resetBtn" onclick="resetSession()" class="px-5 py-3 bg-darkBg border border-darkBorder text-mutedText hover:text-rose-400 rounded-2xl font-mono text-xs transition hidden">
                        END / RESET
                    </button>
                </div>

            </div>
        </section>

        <!-- RIGHT COLUMN: TASKS & SOUND ENGINE (5 COLS) -->
        <section class="lg:col-span-5 flex flex-col gap-5">

            <!-- TASK MANAGER -->
            <div class="bg-darkCard border border-darkBorder rounded-3xl p-6 card-shadow flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-mono font-bold tracking-wider text-mutedText uppercase">TARGET TASK LIST</h2>
                    <span id="taskCount" class="text-xs font-mono text-limeAccent bg-limeAccent/10 px-2 py-0.5 rounded-md">0 Tasks</span>
                </div>

                <!-- ADD TASK INPUT -->
                <div class="flex flex-col gap-2">
                    <input id="newTaskInput" type="text" placeholder="Task description..." class="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2 text-xs text-white placeholder-mutedText focus:outline-none focus:border-limeAccent">
                    <div class="flex items-center gap-2">
                        <input id="newTaskTime" type="number" min="1" max="180" placeholder="Mins (e.g. 30)" class="w-28 bg-darkBg border border-darkBorder rounded-xl px-3 py-1.5 text-xs text-white placeholder-mutedText font-mono focus:outline-none focus:border-limeAccent">
                        <button onclick="addTask()" class="flex-1 bg-white hover:bg-slate-200 text-black font-bold py-1.5 rounded-xl text-xs font-mono transition">+ ADD TASK</button>
                    </div>
                </div>

                <!-- TASKS CONTAINER -->
                <div id="taskList" class="flex flex-col gap-2 max-h-[220px] overflow-y-auto pr-1">
                    <!-- Tasks inserted dynamically -->
                </div>
            </div>

            <!-- AUDIO ENGINE -->
            <div class="bg-darkCard border border-darkBorder rounded-3xl p-6 card-shadow flex flex-col gap-3">
                <div class="flex items-center justify-between text-xs font-mono">
                    <span class="text-mutedText uppercase font-bold tracking-wider">AUDIO ENGINE</span>
                    <span id="activeSoundLabel" class="text-limeAccent font-bold">16Hz Beta Wave</span>
                </div>

                <div class="grid grid-cols-4 gap-2 font-mono text-xs mt-1">
                    <button id="sndBeta" onclick="setSound('binaural', '16Hz Beta Wave')" class="snd-btn py-2 rounded-xl bg-darkBg border border-limeAccent/40 text-limeAccent font-bold transition">16Hz</button>
                    <button id="sndRain" onclick="setSound('rain', 'Rainfall Ambient')" class="snd-btn py-2 rounded-xl bg-darkBg border border-darkBorder text-mutedText hover:text-white transition">Rain</button>
                    <button id="sndPink" onclick="setSound('pink', 'Deep Noise')" class="snd-btn py-2 rounded-xl bg-darkBg border border-darkBorder text-mutedText hover:text-white transition">Noise</button>
                    <button id="sndOff" onclick="setSound('none', 'Audio Muted')" class="snd-btn py-2 rounded-xl bg-darkBg border border-darkBorder text-mutedText hover:text-white transition">Off</button>
                </div>
            </div>

            <!-- CLEAN METRICS -->
            <div class="bg-darkCard border border-darkBorder rounded-3xl p-5 card-shadow grid grid-cols-2 gap-4 font-mono">
                <div class="flex flex-col justify-center">
                    <div class="text-[10px] text-mutedText uppercase tracking-wider">COMPLETED TASKS</div>
                    <div id="completedTasksCount" class="text-xl font-bold text-white mt-1">0</div>
                </div>
                <div class="flex flex-col justify-center border-l border-darkBorder pl-4">
                    <div class="text-[10px] text-mutedText uppercase tracking-wider">TOTAL FOCUS TIME</div>
                    <div id="totalFocusTime" class="text-xl font-bold text-limeAccent mt-1">0m</div>
                </div>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-6xl mx-auto pt-6 border-t border-darkBorder/60 flex items-center justify-between font-mono text-[11px] text-mutedText">
        <span>AETHEL PROTOCOL</span>
        <span>ZERO DISTRACTION INTERFACE</span>
    </footer>

    <script>
        let duration = 25 * 60;
        let timeRemaining = duration;
        let timer = null;
        let isRunning = false;
        let soundMode = 'binaural';
        let audioCtx = null;
        let activeNodes = [];
        let tasks = [];
        let completedCount = 0;
        let totalSecondsFocused = 0;
        let activeTaskTitle = "";

        const timeReadout = document.getElementById('timeReadout');
        const timerProgress = document.getElementById('timerProgress');
        const actionBtn = document.getElementById('actionBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        function setMode(mode) {
            if (isRunning) return;
            document.getElementById('modePomo').className = "px-4 py-1.5 rounded-xl text-mutedText hover:text-white transition";
            document.getElementById('modeShort').className = "px-4 py-1.5 rounded-xl text-mutedText hover:text-white transition";
            document.getElementById('modeLong').className = "px-4 py-1.5 rounded-xl text-mutedText hover:text-white transition";

            if (mode === 'pomo') {
                document.getElementById('modePomo').className = "px-4 py-1.5 rounded-xl bg-limeAccent text-black font-bold transition";
                setMins(25);
            } else if (mode === 'short') {
                document.getElementById('modeShort').className = "px-4 py-1.5 rounded-xl bg-limeAccent text-black font-bold transition";
                setMins(5);
            } else if (mode === 'long') {
                document.getElementById('modeLong').className = "px-4 py-1.5 rounded-xl bg-limeAccent text-black font-bold transition";
                setMins(15);
            }
        }

        function setMins(m) {
            if (isRunning) return;
            duration = m * 60;
            timeRemaining = duration;
            document.getElementById('customMinsInput').value = m;
            updateGauge();
        }

        function applyCustomMins() {
            if (isRunning) return;
            const val = parseInt(document.getElementById('customMinsInput').value);
            if (val && val > 0) {
                setMins(val);
            }
        }

        function updateGauge() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            timeReadout.innerText = `${m}:${s}`;
            const total = 1100;
            timerProgress.style.strokeDashoffset = total - (timeRemaining / duration) * total;
        }

        function toggleSession() {
            if (isRunning) { pauseSession(); } else { startSession(); }
        }

        function startSession() {
            isRunning = true;
            actionBtn.innerText = "PAUSE";
            actionBtn.className = "px-8 py-3 bg-amber-400 hover:bg-amber-500 text-black font-bold rounded-2xl font-mono text-sm tracking-wide shadow-lg transition transform active:scale-95";
            resetBtn.classList.remove('hidden');

            statusText.innerText = "Active";
            statusDot.className = "w-2 h-2 rounded-full bg-limeAccent animate-pulse";

            startAudio();

            timer = setInterval(() => {
                timeRemaining--;
                totalSecondsFocused++;
                updateGauge();
                updateStats();

                if (timeRemaining <= 0) {
                    completeSession();
                }
            }, 1000);
        }

        function pauseSession() {
            clearInterval(timer);
            timer = null;
            isRunning = false;
            stopAudio();

            actionBtn.innerText = "RESUME";
            actionBtn.className = "px-8 py-3 bg-limeAccent hover:bg-[#c2ed2e] text-black font-bold rounded-2xl font-mono text-sm tracking-wide shadow-lg transition transform active:scale-95";
            statusText.innerText = "Paused";
            statusDot.className = "w-2 h-2 rounded-full bg-amber-400";
        }

        function resetSession() {
            clearInterval(timer);
            timer = null;
            isRunning = false;
            stopAudio();

            timeRemaining = duration;
            updateGauge();

            actionBtn.innerText = "START SESSION";
            actionBtn.className = "px-8 py-3 bg-limeAccent hover:bg-[#c2ed2e] text-black font-bold rounded-2xl font-mono text-sm tracking-wide shadow-lg transition transform active:scale-95";
            resetBtn.classList.add('hidden');
            statusText.innerText = "Ready";
            statusDot.className = "w-2 h-2 rounded-full bg-limeAccent";
        }

        function completeSession() {
            resetSession();
            statusText.innerText = "Completed";
        }

        function updateStats() {
            const mins = Math.floor(totalSecondsFocused / 60);
            document.getElementById('totalFocusTime').innerText = `${mins}m`;
        }

        // TASK SYSTEM
        function addTask() {
            const txt = document.getElementById('newTaskInput').value.trim();
            const mins = parseInt(document.getElementById('newTaskTime').value) || 25;
            if (!txt) return;

            const task = { id: Date.now(), title: txt, durationMins: mins, done: false };
            tasks.push(task);
            document.getElementById('newTaskInput').value = '';
            document.getElementById('newTaskTime').value = '';
            renderTasks();
        }

        function loadTaskToTimer(taskMins, title) {
            if (isRunning) return;
            setMins(taskMins);
            activeTaskTitle = title;
            document.getElementById('subjectBadge').innerText = title.toUpperCase();
        }

        function toggleTaskDone(id) {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    if (!t.done) completedCount++; else completedCount--;
                    return { ...t, done: !t.done };
                }
                return t;
            });
            document.getElementById('completedTasksCount').innerText = completedCount;
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            document.getElementById('taskCount').innerText = `${tasks.length} Tasks`;

            tasks.forEach(t => {
                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl border ${t.done ? 'bg-darkBg/40 border-darkBorder opacity-50' : 'bg-darkBg border-darkBorder'} flex items-center justify-between gap-3 w-full transition`;

                card.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <button onclick="toggleTaskDone(${t.id})" class="w-4 h-4 rounded-md border shrink-0 ${t.done ? 'bg-limeAccent border-limeAccent' : 'border-darkBorder'} flex items-center justify-center text-black font-bold text-[10px]">
                            ${t.done ? '✓' : ''}
                        </button>
                        <span class="text-xs text-white truncate ${t.done ? 'line-through text-mutedText' : ''}">${t.title}</span>
                    </div>
                    <div class="flex items-center gap-2 font-mono text-[10px] shrink-0">
                        <span class="text-mutedText">${t.durationMins}m</span>
                        <button onclick="loadTaskToTimer(${t.durationMins}, '${t.title.replace(/'/g, "\\'")}')" class="px-2.5 py-1 bg-darkCard border border-darkBorder hover:border-limeAccent/50 text-limeAccent rounded-lg transition font-semibold">Focus</button>
                        <button onclick="deleteTask(${t.id})" class="text-mutedText hover:text-rose-400 px-1 text-xs">✕</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // AUDIO GENERATOR
        function setSound(mode, label) {
            soundMode = mode;
            document.getElementById('activeSoundLabel').innerText = label;
            document.querySelectorAll('.snd-btn').forEach(b => b.className = "snd-btn py-2 rounded-xl bg-darkBg border border-darkBorder text-mutedText hover:text-white transition");
            event.currentTarget.className = "snd-btn py-2 rounded-xl bg-darkBg border border-limeAccent/40 text-limeAccent font-bold transition";
            if (isRunning) { stopAudio(); startAudio(); }
        }

        function startAudio() {
            if (soundMode === 'none') return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (soundMode === 'binaural') {
                let m = audioCtx.createChannelMerger(2);
                let o1 = audioCtx.createOscillator(); o1.frequency.value = 200; o1.connect(m, 0, 0);
                let o2 = audioCtx.createOscillator(); o2.frequency.value = 216; o2.connect(m, 0, 1);
                m.connect(audioCtx.destination); o1.start(); o2.start();
                activeNodes = [o1, o2];
            }
        }

        function stopAudio() {
            activeNodes.forEach(n => { try { n.stop(); } catch(e){} });
            if (audioCtx) audioCtx.close();
            activeNodes = [];
        }

        updateGauge();
    </script>
</body>
</html>
